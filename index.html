<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),app=$('#app'),music=$('#chapterMusic');
const memory=[['2024.11.03','故事開始的那一天','從這一天開始，平凡的日子裡，多了一個特別的妳。','assets/memory-41.jpg'],['2024.12.25','第一個一起過的聖誕節','第一個聖誕節，因為有妳在身邊，連冬天都變得很溫暖。','assets/memory-42.jpg'],['2025.01.01','第一次一起迎接新年','新的一年開始時，我最想一起迎接的人，就是妳。','assets/memory-43.jpg'],['2025.07.19','第一次陪妳過生日','第一次陪妳過生日，希望妳那天的開心，也能一直留在往後的每一天。','assets/memory-49.jpg'],['2025.11.03','我們的第一週年','走過第一年之後，才更確定，之後的路我也都想和妳一起走。','assets/memory-47.jpg']];
const lessons=[['先想想妳的感受','以前的我，常常先想事情有沒有道理。\n但和妳在一起之後，我慢慢懂了，\n有些時候，比起急著解釋，\n更重要的是先在意妳當下的感受。'],['不是每件事都要爭對錯','我以前總以為，\n只要把事情講清楚，問題就會變少。\n可是妳讓我知道，\n關係裡不是每一次都要分出誰對誰錯，\n有時候，理解比結論更重要。'],['好好聽妳說完','妳讓我慢慢學會，\n不要急著回應，也不要急著反駁。\n先聽妳說完，先懂妳在意什麼，\n其實比我急著表達自己，更重要。']];
const postcards=[['一起去沒去過的地方','想和妳一起去還沒去過的地方，\n不是因為風景一定多特別，\n而是想到能和妳一起出發，\n就會覺得那段路值得期待。'],['一起過那些普通的日子','比起那些特別安排的節日，\n我其實也很期待，\n和妳一起過很多看起來沒什麼特別的日子。\n吃飯、散步、說說話，這樣就很好。'],['一起慢慢變老一點','如果可以的話，\n我也想和妳一起慢慢變老一點。\n不是一下子走到很遠的以後，\n而是把每一段日子，都慢慢走長。']];
let current='',sceneToken=0,unlocks=new Set(),seen=new Set(),selected=-1,puzzle=[2,0,3,1],holdProgress=0,holdRAF=0,holding=false,openedCount=0,planeSent=false,joined=false,walked=false,doorOpening=false,video=null;
const scene=(klass,inner)=>'<section class="scene '+klass+'">'+inner+'</section>';
const head=(chapter,back)=>'<div class="top"><button class="back" data-next="'+back+'" aria-label="返回">‹</button><small>'+chapter+' / 06 · OUR STORY</small><span class="tiny">♡</span></div>';
const button=(label,id,disabled=false)=>'<button class="primary" '+(disabled?'disabled ':'')+'id="'+id+'">'+label+'</button>';
const title=(cap,t,sub='')=>'<div class="hero"><div class="overline">'+cap+'</div><h1>'+t+'</h1>'+(sub?'<p class="sub">'+sub+'</p>':'')+'</div>';
function days(){const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const a=fmt.split('-').map(Number);return Math.max(0,Math.floor((Date.UTC(a[0],a[1]-1,a[2])-Date.UTC(2024,10,3))/86400000))}
const sound=()=>'<button class="sound" id="musicToggle" aria-label="切換音樂">'+(music.paused?'♫ 播放':'♫ 暫停')+'</button>';
function set(id){if(current===id)return;const prior=current,old=$('.scene.active');const token=++sceneToken;const enteringFour=id.startsWith('four')&&!prior.startsWith('four'),leavingFour=prior.startsWith('four')&&!id.startsWith('four');if(enteringFour){music.currentTime=0;music.play().catch(()=>{})}if(leavingFour){music.pause();music.currentTime=0}if(prior==='video'&&video)video.pause();
let html=render(id);const wrap=document.createElement('div');wrap.innerHTML=html;let node=wrap.firstElementChild;app.appendChild(node);if(old){old.classList.remove('active');old.classList.add('exiting')}requestAnimationFrame(()=>requestAnimationFrame(()=>{node.classList.add('active')}));current=id;attach(id,node);setTimeout(()=>{if(token!==sceneToken)return;app.querySelectorAll('.scene:not(.active)').forEach(e=>e.remove())},1100)}
function render(id){
switch(id){
case 'cover':return scene('cover','<div class="cover-accessible">輕觸畫面，開啟我們的故事</div>');
case 'envelope':return scene('night',head('01','cover')+title('A LETTER FOR YOU','有一些話，<br>想換一種方式告訴妳。')+'<div class="envelope-stage"><div class="envelope-graphic" id="openEnvelope"><div class="letter-peek"></div><div class="pocket"></div><div class="fold"></div><div class="flap"></div><div class="wax">♡</div></div></div><p class="hint">輕觸信封，拆開第一封信</p>');
case 'letter':return scene('paper-scene',head('01','envelope')+title('OUR STORY','想和妳一起讀的一封信')+'<div class="spacer"></div><article class="letter-sheet">有些日子，當下沒有覺得特別。\n可是回頭看時，才發現\n那些平凡的片刻，\n因為有妳，都變得值得收藏。\n\n這份小小的禮物，\n想邀請妳一起打開。</article><div class="spacer"></div>'+button('一起翻開我們的故事 →','nextDays'));
case 'days':return scene('paper-scene',head('02','letter')+title('CHAPTER 02 · TIME','原來，已經一起走了這麼久','從 2024 年 11 月 3 日開始')+'<div class="spacer"></div><div id="hold" class="timeline-heart" role="button" tabindex="0" aria-label="長按讓愛心填滿"><div class="heart-shape"></div><div class="heart-fill" id="heartFill"></div><div class="heart-number">'+days()+'<small>DAYS TOGETHER</small></div></div><p class="hint">長按畫面，讓我們一起走過的時間慢慢填滿 ♡</p><div class="spacer"></div>'+button('打開那些日子 →','toMemories',holdProgress<1));

case 'fourStars':return scene('night',head('04','puzzleDone')+title('CHAPTER 04 · UNDERSTANDING','我們本來是不一樣的人','但慢慢地，也開始學著走近彼此。')+'<div class="star-stage" id="starStage"><span class="star-dot first">✦</span><span class="star-dot second">✦</span></div><p class="hint">輕觸星星，看見我們慢慢靠近</p>'+sound()+button('那些妳教會我的事 →','toLessons',!unlocks.has('stars')));
case 'fourLessons':return scene('paper-scene',head('04','fourStars')+title('WHAT YOU TAUGHT ME','妳讓我學會的事','把卡片翻開，看看妳教會我的事。')+'<div class="cards">'+lessons.map((l,i)=>'<button class="lesson '+(unlocks.has('lesson'+i)?'open':'')+'" data-lesson="'+i+'"><strong>0'+(i+1)+'　'+l[0]+'</strong><p>'+l[1]+'</p></button>').join('')+'</div><p class="hint">已翻開 '+lessons.filter((l,i)=>unlocks.has('lesson'+i)).length+' / 3 張</p>'+button('繼續走向妳 →','toWalk',!lessons.every((l,i)=>unlocks.has('lesson'+i))));
case 'fourWalk':return scene('night',head('04','fourLessons')+title('SIDE BY SIDE','我們不需要完全一樣','只是想慢慢學會，站在彼此身邊。')+'<div class="walk-world" id="walkWorld"><div class="walk-glow"></div>'+[1,2].map((n)=>'<div class="walker '+(n===1?'one':'two')+'"><div class="head"></div><div class="torso"></div><div class="arm l"></div><div class="arm r"></div><div class="leg l"></div><div class="leg r"></div></div>').join('')+'</div><p class="hint" id="walkHint">兩個人，慢慢走到彼此身邊。</p>'+button('留給妳的一句話 →','toWish',!walked));
case 'fourWish':return scene('night',head('04','fourWalk')+title('A SMALL PROMISE','有一句話，想留給妳')+'<div class="spacer"></div><div class="handnote">謝謝妳讓我看見，\n原來愛一個人，\n不只是陪伴，\n也是願意因為對方，\n慢慢成為更好的人。</div><div class="spacer"></div>'+button('妳讓我學會的事 ♡ →','toFourEnd'));
case 'fourEnd':return scene('night',head('04','fourWish')+'<div class="spacer"></div><div class="center"><div class="overline">BECAUSE OF YOU</div><h1 style="margin-top:26px">妳讓我學會的事，<br>我都有慢慢記在心裡。</h1></div><div class="spacer"></div>'+button('翻開我們的以後 →','toFive'));
case 'fiveBook':return scene('paper-scene',head('05','fourEnd')+title('CHAPTER 05 · TOMORROW','還沒寫完的以後')+'<div class="spacer"></div><div class="book" style="display:grid;place-items:center;text-align:center">翻到這裡才發現，<br>我最期待的，<br>不只是已經發生的那些事。</div><div class="spacer"></div>'+button('翻到下一頁 →','toPostcards'));
case 'fivePostcards':return scene('paper-scene',head('05','fiveBook')+title('POSTCARDS FROM TOMORROW','想和妳一起做的事')+'<div class="cards">'+postcards.map((p,i)=>'<button class="postcard '+(unlocks.has('postcard'+i)?'open':'')+'" data-postcard="'+i+'"><strong>✉　'+p[0]+'</strong><p>'+p[1]+'</p></button>').join('')+'</div><p class="hint">讀過 '+postcards.filter((p,i)=>unlocks.has('postcard'+i)).length+' / 3 張明信片</p>'+button('寄一封信給未來 →','toPlane',!postcards.every((p,i)=>unlocks.has('postcard'+i))));
case 'fivePlane':return scene('sunrise',head('05','fivePostcards')+title('A LETTER TO THE FUTURE','把心願寄往未來')+'<div class="spacer"></div><button id="plane" class="plane" style="border:0;background:transparent" aria-label="放飛紙飛機">✉</button><div class="spacer"></div><p class="bodycopy center">'+(planeSent?'未來會是什麼樣子，\n我們現在都還不知道。\n但只要想到有些日子，\n也許會和妳一起走過，\n就會覺得以後也值得期待。':'輕觸紙飛機，讓它帶著心願飛出去。')+'</p><div class="spacer"></div>'+button('一起看看以後 →','toFuture',!planeSent));
case 'fiveFuture':return scene('sunrise',head('05','fivePlane')+'<div class="spacer"></div>'+title('THE ORDINARY DAYS','我最期待的日子')+'<div class="spacer"></div><p class="bodycopy center">我希望以後那些看起來沒什麼特別的日子，<br>身邊還是有妳。<br><br>不是因為未來一定要多盛大，<br>而是有妳在的日子，<br>平凡也會變得很值得。</p><div class="spacer"></div>'+button('留下一點空白 →','toFinalBook'));
case 'fiveFinal':return scene('paper-scene',head('05','fiveFuture')+title('TO BE CONTINUED','未完待續')+'<div class="spacer"></div><div class="book center">至於剩下的故事，<br>就留給以後的我們，<br>慢慢寫下去。<br><br>✿</div><div class="spacer"></div>'+button('打開最後一件禮物 →','toDoor'));
case 'door':return scene('night door-art',head('06','fiveFinal')+'<div class="door-copy">'+title('THE FINAL GIFT','還有最後一件禮物','想讓妳親自打開。')+'</div><div class="door-stage" id="doorStage" aria-label="點擊打開最後一道門"><div class="portal"><div class="door-leaf left"></div><div class="door-leaf right"></div></div></div><p class="hint door-hint">輕觸畫面，打開最後一道門 ♡</p>');
case 'video':return scene('video-scene',head('06','door')+'<div class="video-box"><video id="film" playsinline webkit-playsinline controls preload="auto" src="assets/chapter-06.mp4"></video><div class="video-error" id="videoError"><h2>影片暫時無法播放</h2><p class="sub">可以重新載入，或先看看最後的告白。</p><button class="ghost" id="retryFilm">重新載入影片</button><button class="ghost" id="skipFilm">閱讀最後的話 →</button></div></div><p class="hint">這段影片，想送給妳。</p>');
case 'end':return scene('night',head('06','video')+'<div class="end-message"><div class="heart">♡</div><p>這些是我們一起走過的日子。</p><p>至於以後會寫下什麼樣的故事，<br>我還不知道。</p><p>但很謝謝妳，<br>出現在我的故事裡。</p><h1>兩週年快樂。♡</h1></div><div class="end-actions">'+button('再看一次影片','replay')+'<button class="ghost" id="restart">回到故事起點</button></div>');
default:return scene('night',title('OUR STORY','未完待續'))}}
function nav(id){const map={nextDays:'days',toMemories:'memories',toPuzzle:'puzzle',puzzleNext:'puzzleDone',startFour:'fourStars',toLessons:'fourLessons',toWalk:'fourWalk',toWish:'fourWish',toFourEnd:'fourEnd',toFive:'fiveBook',toPostcards:'fivePostcards',toPlane:'fivePlane',toFuture:'fiveFuture',toFinalBook:'fiveFinal',toDoor:'door'};if(map[id])set(map[id])}
function attach(id,root){
root.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>set(b.dataset.next));
root.querySelectorAll('.primary').forEach(b=>b.onclick=()=>nav(b.id));
if(id==='cover'){root.setAttribute('tabindex','0');root.onclick=()=>set('envelope');root.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();set('envelope')}}}
if(id==='envelope')root.querySelector('#openEnvelope').onclick=e=>{e.currentTarget.classList.add('open');setTimeout(()=>{if(current==='envelope')set('letter')},1250)};
if(id==='days')initHold(root);
if(id==='memories')root.querySelectorAll('[data-memory]').forEach(b=>b.onclick=()=>{openedCount=+b.dataset.memory;seen.add(openedCount);set('memory')});
if(id==='memory'){root.querySelector('#prevMemory').style.visibility=openedCount===0?'hidden':'visible';root.querySelector('#prevMemory').onclick=()=>{openedCount--;set('memory')};root.querySelector('#nextMemory').onclick=()=>{if(openedCount===memory.length-1)set('memories');else{openedCount++;set('memory')}}}
if(id==='puzzle')initPuzzle(root);
if(id==='fourStars'){root.querySelector('#starStage').onclick=e=>{e.currentTarget.classList.add('joined');unlocks.add('stars');setTimeout(()=>{if(current==='fourStars')root.querySelector('#toLessons').disabled=false},2850)}}
if(id==='fourLessons')root.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{b.classList.add('open');unlocks.add('lesson'+b.dataset.lesson);root.querySelector('.hint').textContent='已翻開 '+lessons.filter((l,i)=>unlocks.has('lesson'+i)).length+' / 3 張';root.querySelector('#toWalk').disabled=!lessons.every((l,i)=>unlocks.has('lesson'+i))});
if(id==='fourWalk'){let field=root.querySelector('#walkWorld');if(walked){field.classList.add('moving','done');root.querySelector('#toWish').disabled=false}else{requestAnimationFrame(()=>requestAnimationFrame(()=>field.classList.add('moving')));setTimeout(()=>{if(current==='fourWalk'){field.classList.add('done');walked=true;root.querySelector('#walkHint').textContent='我們不用完全一樣，也可以努力理解彼此。';root.querySelector('#toWish').disabled=false}},3700)}}
if(id==='fivePostcards')root.querySelectorAll('[data-postcard]').forEach(b=>b.onclick=()=>{b.classList.add('open');unlocks.add('postcard'+b.dataset.postcard);root.querySelector('.hint').textContent='讀過 '+postcards.filter((l,i)=>unlocks.has('postcard'+i)).length+' / 3 張明信片';root.querySelector('#toPlane').disabled=!postcards.every((l,i)=>unlocks.has('postcard'+i))});
if(id==='fivePlane')root.querySelector('#plane').onclick=e=>{if(planeSent)return;planeSent=true;e.currentTarget.classList.add('flying');setTimeout(()=>{if(current==='fivePlane')set('fivePlane')},1800)};
if(id==='door'){doorOpening=false;root.onclick=e=>{if(e.target.closest('[data-next]')||doorOpening)return;doorOpening=true;root.classList.add('door-opening');const src='assets/chapter-06.mp4';if(!video){video=document.createElement('video');video.src=src;video.preload='auto';video.playsInline=true;video.style.display='none';app.appendChild(video)}video.currentTime=0;video.play().catch(()=>{});setTimeout(()=>{if(current==='door')set('video')},2400)}}
if(id==='video'){const v=root.querySelector('#film');if(video){v.currentTime=video.currentTime;video.pause()}video=v;v.onended=()=>set('end');v.onerror=()=>root.querySelector('#videoError').classList.add('show');v.play().catch(()=>{v.controls=true});root.querySelector('#retryFilm').onclick=()=>{root.querySelector('#videoError').classList.remove('show');v.load();v.play().catch(()=>{})};root.querySelector('#skipFilm').onclick=()=>set('end')}
if(id==='end'){root.querySelector('#replay').onclick=()=>{if(video)video.currentTime=0;set('video')};root.querySelector('#restart').onclick=()=>{music.pause();set('cover')}}
const toggle=root.querySelector('#musicToggle');if(toggle)toggle.onclick=()=>{if(music.paused)music.play().catch(()=>{});else music.pause();toggle.textContent=music.paused?'♫ 播放':'♫ 暫停'} }
function initHold(root){const h=root.querySelector('#hold'),fill=root.querySelector('#heartFill');function paint(){fill.style.setProperty('--fill',holdProgress);root.querySelector('#toMemories').disabled=holdProgress<1}function tick(t){if(!holding)return;if(!h.dataset.last)h.dataset.last=t;holdProgress=Math.min(1,holdProgress+(t-Number(h.dataset.last))/11000);h.dataset.last=t;paint();if(holdProgress<1)holdRAF=requestAnimationFrame(tick);else holding=false}function start(e){if(e.cancelable)e.preventDefault();if(holding||holdProgress>=1)return;holding=true;h.dataset.last='';holdRAF=requestAnimationFrame(tick)}function stop(){holding=false;cancelAnimationFrame(holdRAF)}h.addEventListener('pointerdown',e=>{h.setPointerCapture(e.pointerId);start(e)});root.addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.target.closest('#hold'))return;start(e)});root.addEventListener('pointerup',stop);root.addEventListener('pointercancel',stop);h.addEventListener('pointerup',stop);h.addEventListener('pointercancel',stop);h.addEventListener('lostpointercapture',stop);h.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')start(e)});h.addEventListener('keyup',stop);paint()}
function initPuzzle(root){let active=-1;const grid=root.querySelector('#puzzleGrid');const tiles=[...grid.querySelectorAll('.puzzle-tile')];function select(i){if(active===-1){active=i;tiles[i].classList.add('selected');return}const temp=puzzle[active];puzzle[active]=puzzle[i];puzzle[i]=temp;active=-1;tiles.forEach((t,j)=>{t.classList.remove('selected');let n=puzzle[j];t.style.backgroundPosition=(n%2?100:0)+'% '+(n>1?100:0)+'%'});root.querySelector('#puzzleNext').disabled=!puzzle.every((v,j)=>v===j)}tiles.forEach(t=>{t.onclick=()=>select(+t.dataset.tile);t.addEventListener('pointerdown',e=>{t.dataset.sx=e.clientX;t.dataset.sy=e.clientY});t.addEventListener('pointerup',e=>{const dx=e.clientX-Number(t.dataset.sx),dy=e.clientY-Number(t.dataset.sy);if(Math.abs(dx)+Math.abs(dy)<25)return;const box=grid.getBoundingClientRect(),cx=e.clientX-box.left,cy=e.clientY-box.top;if(cx<0||cy<0||cx>box.width||cy>box.height)return;const dest=(cy>box.height/2?2:0)+(cx>box.width/2?1:0);if(active===-1)active=+t.dataset.tile;select(dest)})})}
set('cover');
})();
</script></body></html>
